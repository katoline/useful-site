name: Security verification
on:
  push:
    branches: [audit/security-recheck-20261023]
permissions:
  contents: read
  security-events: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read existing alerts without changing them
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: python
        run: |
          import json, os, urllib.request, urllib.error
          repository = os.environ["GITHUB_REPOSITORY"]
          summary = {"repository": repository}
          for state in ["open", "closed"]:
              selected = []
              try:
                  page = 1
                  while True:
                      url = f"https://api.github.com/repos/{repository}/code-scanning/alerts?state={state}&per_page=100&page={page}&ref=refs/heads/main"
                      request = urllib.request.Request(url, headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json"})
                      with urllib.request.urlopen(request, timeout=30) as response:
                          data = json.load(response)
                      for alert in data:
                          instance = alert.get("most_recent_instance", {})
                          selected.append({"number": alert.get("number"), "state": alert.get("state"), "rule": alert.get("rule", {}).get("id"), "severity": alert.get("rule", {}).get("security_severity_level"), "path": instance.get("location", {}).get("path"), "commit_sha": instance.get("commit_sha"), "fixed_at": alert.get("fixed_at")})
                      if len(data) < 100:
                          break
                      page += 1
                  summary[state] = {"accessible": True, "count": len(selected), "alerts": selected}
              except urllib.error.HTTPError as error:
                  summary[state] = {"accessible": False, "http_status": error.code}
          print("::notice title=Code scanning status::" + json.dumps(summary))
      - name: Read settings without changing them or exposing credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          token = os.environ["CLOUDFLARE_API_TOKEN"]
          account = os.environ["CLOUDFLARE_ACCOUNT_ID"]
          if not token or not account:
              raise SystemExit("Existing Cloudflare credential binding is missing")
          summary = {}
          def read(label, path):
              request = urllib.request.Request(
                  "https://api.cloudflare.com/client/v4" + path,
                  headers={"Authorization": "Bearer " + token, "User-Agent": "katoline-security-read-only-audit"},
              )
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      result = json.load(response)
                  summary[label] = {"accessible": result.get("success", False)}
                  if not result.get("success"):
                      summary[label]["error_codes"] = [e.get("code") for e in result.get("errors", [])]
                      return None
                  return result.get("result")
              except urllib.error.HTTPError as error:
                  summary[label] = {"accessible": False, "http_status": error.code}
              except Exception as error:
                  summary[label] = {"accessible": False, "error_type": type(error).__name__}
              return None
          verified = read("token", "/user/tokens/verify")
          if verified:
              summary["token"]["active"] = verified.get("status") == "active"
          user = read("token_owner", "/user")
          if user:
              summary["token_owner"]["mfa_enabled"] = user.get("two_factor_authentication_enabled")
          details = read("account", f"/accounts/{account}")
          if details:
              summary["account"]["mfa_enforced"] = details.get("settings", {}).get("enforce_twofactor")
          settings = read("worker", f"/accounts/{account}/workers/scripts/useful-site/settings")
          if settings:
              summary["worker"].update({
                  "compatibility_date": settings.get("compatibility_date"),
                  "nodejs_compat": "nodejs_compat" in settings.get("compatibility_flags", []),
                  "rate_limit_binding_present": any(b.get("name") == "FETCH_IMAGE_RATE_LIMITER" and b.get("type") == "ratelimit" for b in settings.get("bindings", [])),
                  "observability_enabled": settings.get("observability", {}).get("enabled"),
              })
          subdomain = read("workers_dev", f"/accounts/{account}/workers/scripts/useful-site/subdomain")
          if subdomain:
              summary["workers_dev"]["enabled"] = subdomain.get("enabled")
          policies = read("notifications", f"/accounts/{account}/alerting/v3/policies")
          if policies is not None:
              policies = policies.get("policies", []) if isinstance(policies, dict) else policies
              summary["notifications"]["enabled_billing_policy_count"] = sum(1 for p in policies if p.get("enabled") and "billing" in p.get("alert_type", ""))
          zones = read("zone", f"/zones?name=t0n03k1.com&account.id={account}")
          if zones:
              zone = zones[0]
              summary["zone"]["active"] = zone.get("status") == "active"
              for phase in ["http_request_firewall_managed", "http_ratelimit", "http_request_firewall_custom"]:
                  ruleset = read(phase, f"/zones/{zone['id']}/rulesets/phases/{phase}/entrypoint")
                  if ruleset:
                      summary[phase]["enabled_rule_count"] = sum(1 for r in ruleset.get("rules", []) if r.get("enabled", True))
          # Only booleans, counters, public compatibility dates and status codes are emitted.
          payload = json.dumps(summary, ensure_ascii=True).replace("%", "%25")
          print("::notice title=Cloudflare security metadata::" + payload)
          PY
