# main へのマージ（push）で CI の verify が成功したら、そのコミットを本番へ自動デプロイする。
# CI を待つために workflow_run で起動し、失敗したコミットはデプロイしない（ビルドは deploy でもやり直す）。
# 自動デプロイはリポジトリ変数 DEPLOY_ENABLED=true で有効になる（準備が済むまでは skip）。
# 手元から出すときは `nix develop -c pnpm run deploy`。
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # 準備後の初回や、CI を待たずに出したいとき用（その時点の main を出す）
  workflow_dispatch:

# 既定では何も書き込めない（公開リポジトリのため）。デプロイは Cloudflare の API トークンで行う
permissions:
  contents: read

# 本番への反映は1つずつ。CIの完了順は前後し得るため、公開直前にも最新mainか確認する。
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    # main への push で成功した CI のときだけ。PR の CI・失敗した CI では動かさない
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.conclusion == 'success' &&
      vars.DEPLOY_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # action はタグではなくコミット SHA で固定する（タグの付け替えによる差し替えを防ぐ）
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # CI が検証したコミットそのものを出す（待っている間に次の push が来ても追随しない）
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: devShell を用意する
        run: nix develop -c node --version

      - name: pnpm のストアの場所を調べる
        id: pnpm-store
        run: echo "path=$(nix develop -c pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: 依存を入れる
        run: nix develop -c pnpm install --frozen-lockfile

      # 設定漏れは wrangler の分かりにくいエラーになる前に、ここで止める
      - name: 認証情報を確認する
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Secrets に CLOUDFLARE_API_TOKEN を設定してください"
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Variables に CLOUDFLARE_ACCOUNT_ID を設定してください"
            exit 1
          fi

      # ビルドプラグインには公開用トークンを渡さない。公開変数だけで検証・ビルドする。
      - name: 公開前の検証とビルド
        run: |
          nix develop -c node scripts/check-deploy-env.ts
          nix develop -c pnpm build
        env:
          # 未設定なら空文字になり、広告は本番で非表示・ads.txt は出ない・解析のビーコンも入らない
          VITE_ADSENSE_CLIENT: ${{ vars.VITE_ADSENSE_CLIENT }}
          VITE_ADSENSE_SLOT_BANNER: ${{ vars.VITE_ADSENSE_SLOT_BANNER }}
          VITE_ADSENSE_SLOT_RESPONSIVE: ${{ vars.VITE_ADSENSE_SLOT_RESPONSIVE }}
          VITE_ADSENSE_SLOT_IN_ARTICLE: ${{ vars.VITE_ADSENSE_SLOT_IN_ARTICLE }}
          VITE_ADSENSE_SLOT_SIDEBAR: ${{ vars.VITE_ADSENSE_SLOT_SIDEBAR }}
          VITE_CF_ANALYTICS_TOKEN: ${{ vars.VITE_CF_ANALYTICS_TOKEN }}

      - name: 公開する
        run: |
          deployment_sha=$(git rev-parse HEAD)
          current_main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$deployment_sha" != "$current_main_sha" ]; then
            echo "::notice::mainが更新されたため、古いコミットの公開をスキップします"
            echo "Skipped stale deployment: $deployment_sha (main: $current_main_sha)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          nix develop -c pnpm exec wrangler deploy
          echo "Published verified main commit: $deployment_sha" >> "$GITHUB_STEP_SUMMARY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
